name: Build and Store in S3

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:

  # ============================================================
  # SECURITY SCANNING
  # ============================================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------
      # 4. Dependency vulnerability scan
      # --------------------------------------------------------
      - name: NPM dependency audit
        run: |
          npm audit --audit-level=high

      # --------------------------------------------------------
      # 5. Install Trivy
      # --------------------------------------------------------
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.68.2
          cache: true

      # --------------------------------------------------------
      # 6. Trivy filesystem scan
      # --------------------------------------------------------
      - name: Trivy filesystem scan
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .

  # ============================================================
  # CODEQL
  # ============================================================

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:

      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Initialize CodeQL
      # --------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # --------------------------------------------------------
      # 3. Analyze
      # --------------------------------------------------------
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  # ============================================================
  # BUILD + S3 DEPLOYMENT
  # ============================================================

  build-and-upload:
    name: Build and Upload to S3
    runs-on: ubuntu-latest

    needs:
      - security-scan
      - codeql

    steps:

      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------
      # 4. Build application
      # --------------------------------------------------------
      - name: Build application
        run: npm run build

      # --------------------------------------------------------
      # 5. Validate build output
      # --------------------------------------------------------
      - name: Validate build output
        run: |
          if [ ! -d "build" ]; then
            echo "ERROR: build directory does not exist"
            exit 1
          fi

          if [ -z "$(find build -mindepth 1 -print -quit)" ]; then
            echo "ERROR: build directory is empty"
            exit 1
          fi

          echo "Build directory:"
          ls -lah build

      # --------------------------------------------------------
      # 6. Scan final build
      # --------------------------------------------------------
      - name: Scan final build
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.68.2
          cache: true

      - name: Trivy build scan
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            build/

      # --------------------------------------------------------
      # 7. Configure AWS OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::853973692277:role/sage-doyenai-demo

      # --------------------------------------------------------
      # 8. Verify AWS identity
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # 9. Package build
      # --------------------------------------------------------
      - name: Package build
        run: |
          tar -czf "build-${GITHUB_SHA}.tar.gz" -C build .

          echo "Artifact:"
          ls -lh "build-${GITHUB_SHA}.tar.gz"

      # --------------------------------------------------------
      # 10. Upload versioned build
      # --------------------------------------------------------
      - name: Upload build to S3
        run: |
          aws s3 cp \
            "build-${GITHUB_SHA}.tar.gz" \
            "s3://${{ secrets.S3_BUCKET }}/builds/build-${GITHUB_SHA}.tar.gz"

      # --------------------------------------------------------
      # 11. Upload latest build
      # --------------------------------------------------------
      - name: Upload latest build
        run: |
          aws s3 cp \
            "build-${GITHUB_SHA}.tar.gz" \
            "s3://${{ secrets.S3_BUCKET }}/builds/latest.tar.gz"
